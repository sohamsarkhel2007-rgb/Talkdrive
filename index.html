<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkdrive</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Contacts Screen -->
        <div id="chats-screen" class="screen">
            <header class="app-header">
                <h2>Talkdrive</h2>
                <span id="my-name-display" class="my-name"></span>
            </header>
            <div class="contacts-container">
                <h3>Online Users</h3>
                <ul id="contacts-list"></ul>
            </div>
        </div>

        <!-- Conversation Screen -->
        <div id="conversation-screen" class="screen hidden">
            <header class="chat-header">
                <button id="back-btn" class="icon-btn">←</button>
                <div id="chat-partner-avatar" class="avatar"></div>
                <h3 id="chat-partner-name">User</h3>
                <div class="call-controls">
                    <button id="voice-call-btn" class="icon-btn">📞</button>
                    <button id="video-call-btn" class="icon-btn">📹</button>
                </div>
            </header>

            <div id="chat-messages" class="messages-container"></div>

<div class="input-area">
    <button id="emoji-btn" class="icon-btn">😊</button>
    <button id="attach-btn" class="icon-btn">📎</button>
    <input type="file" id="file-input" style="display: none;" accept="image/*">
    
    <input type="text" id="message-input" placeholder="Type a message..." />
    
    <button id="audio-btn" class="icon-btn">🎙️</button>
    <button id="send-btn" class="send-btn">Send</button>
</div>

            <!-- Emoji Picker -->
            <div id="emoji-picker" class="emoji-picker hidden">
                <span>😀</span><span>😂</span><span>😍</span><span>👍</span><span>❤️</span>
                <span>🔥</span><span>🎉</span><span>🙌</span><span>😎</span><span>✨</span>
            </div>
        </div>
    </div>

    <!-- Video/Voice Call Modal Overlay -->
    <div id="call-modal" class="call-modal hidden">
        <div class="video-grid">
            <video id="remote-video" autoplay playsinline class="remote-video"></video>
            <video id="local-video" autoplay playsinline muted class="local-video"></video>
        </div>
        <div class="call-info">
            <h3 id="call-user-name">User</h3>
            <p id="call-status-text">Connecting...</p>
        </div>
        <div class="call-actions">
            <button id="accept-call-btn" class="call-btn accept hidden">📞 Accept</button>
            <button id="end-call-btn" class="call-btn end">🛑 End</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
