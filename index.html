<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkdrive - Direct Messaging & Calls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- SCREEN 1: CHATS LIST -->
        <div class="screen" id="chats-screen">
            <div class="app-header">
                <h2>Talkdrive</h2>
                <span id="my-name-display"></span>
            </div>
            
            <div class="section-title">Online Contacts (Tap to Chat)</div>
            <ul class="contacts-list" id="contacts-list"></ul>
        </div>

        <!-- SCREEN 2: 1-ON-1 PRIVATE CHAT WINDOW -->
        <div class="screen hidden" id="conversation-screen">
            <div class="chat-header">
                <button id="back-btn">←</button>
                <div class="profile-pic" id="chat-partner-avatar">?</div>
                <div class="chat-title">
                    <h3 id="chat-partner-name">User</h3>
                    <p id="chat-partner-status">Online</p>
                </div>
                <!-- Call Buttons -->
                <div class="call-actions">
                    <button id="voice-call-btn" title="Voice Call">📞</button>
                    <button id="video-call-btn" title="Video Call">📹</button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="emoji-picker" id="emoji-picker">
                <span>😀</span><span>😂</span><span>😍</span><span>🔥</span>
                <span>👍</span><span>❤️</span><span>🎉</span><span>😎</span>
            </div>

            <div class="chat-input-area">
                <button id="emoji-btn" title="Choose Emoji">😊</button>
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <button id="attach-btn" title="Send Image">📎</button>
                <button id="record-btn" title="Record Audio">🎙️</button>
                
                <input type="text" placeholder="Type a message..." id="message-input">
                <button id="send-btn">Send</button>
            </div>
        </div>

        <!-- CALL OVERLAY SCREEN -->
        <div class="call-modal hidden" id="call-modal">
            <div class="video-grid">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="call-status-info">
                <h3 id="call-user-name">Calling...</h3>
                <p id="call-status-text">Connecting...</p>
            </div>
            <div class="call-controls">
                <button id="accept-call-btn" class="call-btn accept hidden">📞 Accept</button>
                <button id="end-call-btn" class="call-btn end">🚫 End</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
